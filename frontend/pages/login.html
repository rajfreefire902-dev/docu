<!DOCTYPE html>
<html>
<head>
    <title>Login - DocuMind</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="auth-body">

<div class="auth-box">
    <h2>Login</h2>
    <form id="login-form">
        <input type="email" id="email" placeholder="Email" class="input-field" required>
        <input type="password" id="password" placeholder="Password" class="input-field" required>
        <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top:15px;">
        Don't have an account? <a href="register.html" style="color:#667eea; font-weight:bold; text-decoration:none;">Register</a>
    </p>
</div>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>

</body>
</html>
